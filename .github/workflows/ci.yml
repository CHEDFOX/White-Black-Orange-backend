name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SIP_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/sip_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/sip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Unit and database tests. Network-marked tests are excluded: a build
      # must not fail because a third-party provider is rate-limiting, and a
      # provider's data changing must not look like a regression.
      - name: Run tests
        run: pytest -q -m "not network" --cov=app --cov-report=term-missing
      - name: Verify migrations apply from scratch
        run: alembic upgrade head
      - name: Verify the migration matches the models
        run: |
          # An autogenerated revision against a migrated database must be
          # empty. A non-empty one means a model changed without a migration,
          # which would break a real deployment.
          alembic revision --autogenerate -m "ci drift check" --rev-id ci_drift
          if grep -qE "op\.(create|drop|alter|add)" alembic/versions/ci_drift_*.py; then
            echo "::error::models have drifted from the migrations; generate a revision"
            cat alembic/versions/ci_drift_*.py
            exit 1
          fi
          rm -f alembic/versions/ci_drift_*.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy app
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t stock-intelligence-backend:ci .
      - name: Check the app imports inside the image
        run: |
          docker run --rm stock-intelligence-backend:ci \
            python -c "from app.main import app; print(len(app.openapi()['paths']), 'endpoints')"

  live-providers:
    # Live provider calls run on a schedule and on demand, never on a push:
    # a rate-limited provider must not fail an unrelated change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Probe the configured providers
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || 'demo' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: pytest -q -m network
