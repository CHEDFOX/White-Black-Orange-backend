name: Scheduled provider check

on:
  schedule:
    # Weekdays after the US close, when a provider shape change would show up.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

jobs:
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check each provider still returns the shape we parse
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || 'demo' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: pytest -q -m network
